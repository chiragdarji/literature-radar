[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "literature-radar"
version = "0.1.0"
description = "Turns a molecule, target or disease into a one-page, cited research brief."
readme = "docs/PRD.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "python-dotenv>=1.0",
    "anthropic>=0.40",
    "streamlit>=1.40",
    "numpy>=1.26",
    "pandas>=2.0",
    "markdown>=3.5",
    "weasyprint>=62",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "watchdog>=4.0",  # lets Streamlit reload changed radar/ modules, not just app.py
]

[tool.setuptools.packages.find]
include = ["radar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E501"]  # inline CSS selectors
# Prompt text and CSV fixtures read better unwrapped.
"radar/brief.py" = ["E501"]
"radar/verify.py" = ["E501"]
"radar/evaluate.py" = ["E501"]
"tests/test_india.py" = ["E501"]
